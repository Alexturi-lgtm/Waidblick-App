name: Fix Nginx Upload Limit (413)
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.HETZNER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Raise client_max_body_size to 25M
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_IP }} "cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak-413fix && (grep -q client_max_body_size /etc/nginx/nginx.conf || sed -i '/http {/a client_max_body_size 25M;' /etc/nginx/nginx.conf) && nginx -t && systemctl reload nginx && echo NGINX_FIXED && grep -n client_max_body_size /etc/nginx/nginx.conf"
